services:
  coding-limits:
    build: .
    container_name: coding-limits
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: 8765
      DEVICE_NAME: AI Limits
      ACCESS_TOKEN: ""
      CODEX_ENABLED: "true"
      CODEX_PATH: /usr/local/bin/codex
      CODEX_TIMEOUT_SECONDS: 10
      CLAUDE_ENABLED: "false"
      CLAUDE_BASE_URL: https://claude.ai
      CLAUDE_SESSION_KEY: ""
      CLAUDE_TIMEOUT_SECONDS: 15
      GEMINI_ENABLED: "false"
      GEMINI_API_KEY: ""
      GEMINI_MODEL: gemini-2.0-flash
      GEMINI_TIMEOUT_SECONDS: 15
    volumes:
      - ${HOME}/.codex:/root/.codex:ro
      - /usr/bin/codex:/usr/local/bin/codex:ro
